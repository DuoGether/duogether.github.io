<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}DuoGether｜遊戲揪團，快速找隊友{% else %}{{ page.title }}｜DuoGether{% endif %}</title>
  <meta name="description" content="DuoGether：遊戲揪團，快速找隊友。">
  <style>
    :root { --ground: #f7f5f0; --ink: #1d2327; --soft: #5a646b; --line: #d9d4c7; --link: #0b6b74; --panel: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #0f1b22; --ink: #e8eef0; --soft: #9fb0b6; --line: #24343c; --link: #6fd3c7; --panel: #152630; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink);
      font: 17px/1.8 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    header, main, footer { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }
    header { padding-top: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
    header a.name { font-weight: 700; font-size: 1.2rem; color: var(--ink); text-decoration: none; }
    nav { margin-top: .4rem; display: flex; flex-wrap: wrap; gap: .2rem 1rem; font-size: .95rem; }
    a { color: var(--link); }
    main { padding-top: 1.5rem; padding-bottom: 3rem; }
    h1 { font-size: 1.7rem; line-height: 1.35; margin: 0 0 1rem; }
    h2 { font-size: 1.25rem; margin: 2.2rem 0 .6rem; padding-top: .8rem; border-top: 1px solid var(--line); }
    h3 { font-size: 1.05rem; margin: 1.6rem 0 .4rem; }
    ul, ol { padding-left: 1.4rem; }
    li { margin: .25rem 0; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; background: var(--panel); font-size: .95rem; }
    th, td { border: 1px solid var(--line); padding: .5rem .7rem; text-align: left; vertical-align: top; }
    th { font-weight: 600; }
    code { font-size: .9em; }
    footer { padding-top: 1rem; padding-bottom: 2.5rem; border-top: 1px solid var(--line); color: var(--soft); font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <a class="name" href="{{ "/" | relative_url }}">DuoGether</a>
    <nav>
      <a href="{{ "/privacy/" | relative_url }}">隱私權政策</a>
      <a href="{{ "/terms/" | relative_url }}">使用條款</a>
      <a href="{{ "/community/" | relative_url }}">社群規範</a>
      <a href="{{ "/delete-account/" | relative_url }}">刪除帳號</a>
      <a href="{{ "/child-safety/" | relative_url }}">兒少安全標準</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    聯絡我們：<a href="mailto:support@duogether.app">support@duogether.app</a><br>
    DuoGether 與任何遊戲、遊戲公司或發行商都沒有合作或從屬關係。
  </footer>
</body>
</html>
